name: 功能建议
description: 新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和痛点，再说你设想的做法
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
