# 依赖更新：每月检查一次，同一生态的小版本与补丁更新合并成一个 PR，减少打扰；
# 安全更新不受这里的时间表限制（需要在仓库 Settings → Code security 打开 Dependabot security updates）
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # anthropic 2.x 默认使用 API 版本 2026-10-21（不再接受 temperature / top_p，密钥改用 Authorization: Bearer），
      # 需要按迁移步骤单独升级，暂不自动更新
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 与类型检查用的 vue-tsc 不兼容（vue-tsc 支持后再放开）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3.12 ~ 3.3.14 在 reactive 对象的 v-model 上误报类型错误，先固定在 3.3.11（以后的版本修好再放开）
      - dependency-name: vue-tsc
        versions: [">= 3.3.12"]
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
