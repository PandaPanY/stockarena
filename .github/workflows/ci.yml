name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: 安装依赖
        run: uv sync --locked
      - name: 代码检查
        run: uv run ruff check .
      - name: 单元测试
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 代码检查
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 类型检查
        run: npm run type-check
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建镜像
        run: docker build -t stockarena:ci .
      - name: 启动并检查
        run: |
          docker run -d --name sa -p 127.0.0.1:18080:18080 -e SA_AUTO_RUN=false stockarena:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/auth/status; then break; fi
            sleep 2
          done
          echo
          curl -sf http://127.0.0.1:18080/ -o /dev/null
          docker logs sa 2>&1 | grep -q "首次设置码"
      - name: 容器日志
        if: always()
        run: docker logs sa 2>&1 | tail -50 || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 密钥扫描（gitleaks，全部提交历史）
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner -c .gitleaks.toml
