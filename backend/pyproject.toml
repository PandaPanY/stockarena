[project]
name = "stockarena"
version = "0.2.0"
description = "StockArena AI 策略工坊后端"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.19.1",
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "apscheduler>=3.10,<4",
    "baostock>=0.9.4",
    "cryptography>=50.0.2",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pandas>=3.0.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:exchange_calendars.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ 是迁移目录，避免被误判为本地包
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的标准写法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
